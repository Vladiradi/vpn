apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vpn-ingress
  namespace: vpn
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: api.vpn.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: panel-api
                port:
                  number: 8080
    - host: admin.vpn.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin-ui
                port:
                  number: 3000
    - host: vpn.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: user-ui
                port:
                  number: 3000
