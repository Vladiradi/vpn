apiVersion: v1
kind: ConfigMap
metadata:
  name: xray-wrapper
  namespace: vpn
data:
  wrapper.sh: |
    #!/bin/sh
    set -e
    CONFIG="/etc/xray/config.json"
    start_xray() {
      echo "[wrapper] starting xray with $CONFIG"
      xray -config "$CONFIG" &
      PID=$!
    }
    start_xray
    LAST=$(stat -c %Y "$CONFIG" 2>/dev/null || echo 0)
    while true; do
      sleep 5
      NEW=$(stat -c %Y "$CONFIG" 2>/dev/null || echo 0)
      if [ "$NEW" != "$LAST" ]; then
        echo "[wrapper] config changed, restarting xray"
        kill "$PID" 2>/dev/null || true
        wait "$PID" 2>/dev/null || true
        start_xray
        LAST=$NEW
      fi
    done
