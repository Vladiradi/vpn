# Control Plane (VPS 1)
# Everything runs in containers. No software is installed on the host.
#
# Services:
#   - panel-api: Go backend
#   - postgres:  PostgreSQL database
#   - redis:     Redis cache/sessions
#   - npm:       Nginx Proxy Manager (public ingress + Let's Encrypt)
#   - log-server: central syslog + logrotate (logs are NOT stored in Postgres or Docker json-file)
#   - backup:    pg_dump to local named volume, no S3
#
# In production expose only Nginx Proxy Manager ports (80, 443, 81).
# Port 8080 for panel-api is exposed only for local development/testing.

# Docker logging driver works at the Docker Engine level (before the Compose
# network is up), so it cannot resolve the "log-server" service name.
# Use the published host port instead — log-server maps 127.0.0.1:514.
x-logging: &syslog-logging
  driver: syslog
  options:
    syslog-address: "udp://127.0.0.1:514"
    tag: "{{.Name}}"

services:
  log-server:
    build:
      context: ./log-server
      dockerfile: Dockerfile
    volumes:
      - logs:/var/log/vpn
    ports:
      - "127.0.0.1:514:514/udp"
      - "127.0.0.1:514:514/tcp"
    restart: unless-stopped
    networks:
      - net-internal

  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    volumes:
      - backups:/backups
    environment:
      PGHOST: "postgres"
      PGUSER: "vpn"
      PGPASSWORD: "vpn"
      PGDATABASE: "vpn"
      RETAIN_COUNT: "7"
      SCHEDULE: "0 3 * * *"
    logging: *syslog-logging
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - net-internal

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vpn
      POSTGRES_PASSWORD: vpn
      POSTGRES_DB: vpn
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    logging: *syslog-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpn -d vpn"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - net-internal

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    logging: *syslog-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - net-internal

  panel-api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      API_MODE: panel
      PORT: "8080"
      DATABASE_URL: "postgres://vpn:vpn@postgres:5432/vpn?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      LOG_LEVEL: "info"
      JWT_SECRET: "dev-secret-change-in-production"
      PAYMENT_PROVIDER: "stub"
      PLATEGA_API_KEY: ""
      PLATEGA_ENDPOINT: "https://api.platega.io/v1"
    logging: *syslog-logging
    depends_on:
      log-server:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - net-internal

  # User UI — published on 127.0.0.1 for local checks; in production served via NPM only.
  user-ui:
    build:
      context: ../frontend/user
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://panel-api:8080
    ports:
      - "127.0.0.1:3001:3000"
    logging: *syslog-logging
    depends_on:
      - panel-api
    restart: unless-stopped
    networks:
      - net-internal

  # Admin UI — published on 127.0.0.1 for local checks; in production served via NPM only.
  admin-ui:
    build:
      context: ../frontend/admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://panel-api:8080
    ports:
      - "127.0.0.1:3000:3000"
    logging: *syslog-logging
    depends_on:
      - panel-api
    restart: unless-stopped
    networks:
      - net-internal

  npm:
    image: jc21/nginx-proxy-manager:latest
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    environment:
      DB_SQLITE_FILE: "/data/database.sqlite"
    logging: *syslog-logging
    restart: unless-stopped
    networks:
      - net-internal

volumes:
  pgdata:
  npm_data:
  npm_letsencrypt:
  logs:
  backups:

networks:
  net-internal:
    driver: bridge
