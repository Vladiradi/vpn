apiVersion: v1
kind: Secret
metadata:
  name: panel-api-secret
  namespace: vpn
type: Opaque
stringData:
  JWT_SECRET: "dev-secret-change-in-production"
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  GOOGLE_REDIRECT_URL: "http://localhost:3000/auth/callback"
  TELEGRAM_BOT_TOKEN: ""
  TELEGRAM_BOT_NAME: ""
  PAYMENT_PROVIDER: "stub"
  PLATEGA_API_KEY: ""
  PLATEGA_ENDPOINT: "https://api.platega.io/v1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: panel-api
  namespace: vpn
spec:
  replicas: 1
  selector:
    matchLabels:
      app: panel-api
  template:
    metadata:
      labels:
        app: panel-api
    spec:
      initContainers:
        # Wait for postgres to be ready before starting the panel.
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done"]
      containers:
        - name: panel-api
          image: vpn/panel:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: API_MODE
              value: "panel"
            - name: PORT
              value: "8080"
            - name: DATABASE_URL
              value: "postgres://vpn:vpn@postgres:5432/vpn?sslmode=disable"
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: LOG_LEVEL
              value: "info"
          envFrom:
            - secretRef:
                name: panel-api-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: panel-api
  namespace: vpn
spec:
  selector:
    app: panel-api
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
