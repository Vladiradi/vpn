apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-ui
  namespace: vpn
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-ui
  template:
    metadata:
      labels:
        app: admin-ui
    spec:
      containers:
        - name: admin-ui
          image: vpn/admin-ui:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: admin-ui
  namespace: vpn
spec:
  selector:
    app: admin-ui
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
