stages:
  - test
  - build
  - deploy

variables:
  GO_VERSION: "1.27"
  NODE_VERSION: "22"

backend:test:
  stage: test
  image: golang:${GO_VERSION}
  before_script:
    - cd backend
  script:
    - go mod download
    - go build ./...
    - go vet ./...
    - go test ./...
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

frontend:user:build:
  stage: build
  image: node:${NODE_VERSION}
  before_script:
    - cd frontend/user
  script:
    - npm ci
    - npm run build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

frontend:admin:build:
  stage: build
  image: node:${NODE_VERSION}
  before_script:
    - cd frontend/admin
  script:
    - npm ci
    - npm run build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy:production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$VPS_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
  script:
    - |
      ssh "$VPS_USER@$VPS_HOST" << 'EOF'
        set -e
        cd /opt/vpn
        git pull origin main
        cd deploy
        docker compose -f docker-compose.control.yml pull
        docker compose -f docker-compose.control.yml up -d
        docker system prune -f
      EOF
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
